
<style>
{% capture css %}
#hell-yeah{
    display: flex;
    gap:10px;
    margin-bottom: 2rem;
}


#status {
    background:var(--color-accent);
    position: relative;
    overflow:hidden;
    border: 3px solid black;
    max-width:200px;
    user-select: none;
    color: black;

    &_design{
       min-height:100px;
        height:100%;

        img{
            margin-top:10px;
            width:100%;
            height: auto;
            z-index:1;
        }

        h1{
            position:absolute;
            bottom:10px;
            right:10px;
            color:white;
            z-index:2;
        }
    }
    &_content {
        background-color:white;
        border-radius:0 0 50% 50%;
        border-top:0;
        transform:scaleX(200%);
        border:3px solid black;
        border-top:0;
    }
}


#statuscafe {
    padding:2rem 1rem;
    transform:scaleX(50%);

    &-username {
        font-family:grandstander;
        font-weight: bold;

        a {
            display:none;
        }
    }
}

@media only screen and (max-width: 700px) {
    #hell-yeah{ display: block; }
    #micro{
        margin: auto;
        margin-bottom: 2rem;
        max-width: 250px;
    }
}

#other {
    display: flex;
    flex-wrap: wrap;
    gap:0.5rem 2rem;
}

#other a:hover { color: var(--color-accent); }
{% endcapture %}
{{ css | scssify }}
</style>
