<style>
{% capture css %}
@import url('https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@100..700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Barriecito&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap');

#comicContainer .item-container {
    .psych {
        --display-font:"Barriecito";
        overflow: hidden;
        color:white;
        background-color: #1b1a18;
        font-family: "M PLus 1 Code";
        .item-title {color:#d6a95c;}
        .item-thumb{
            flex:2;
            margin-left:-10%;
            transform:skew(10deg);
            overflow: hidden;
            img{transform: skew(-10deg) scale(120%);}
        }
        .item-desc{margin-left:0.5rem;}
        .item-link{margin-left:1rem;}
    }

    .muse {
        --yellow:#efe4b0;
        --light-pink:#edb18b;
        --pink:#ed4d46;
        color: black;
        background-color: var(--yellow);
        background-size: 20px 20px;
        background-image: 
        repeating-linear-gradient(0deg, var(--light-pink), var(--light-pink) 2px, var(--yellow) 2px, var(--yellow));

        .item-thumb{
            flex:0;
            position: relative;
            img {
                position: absolute;
                max-width: unset;
                width:5rem;
                height: auto;
                z-index:1;
                transform: scale(130%) rotate(-15deg) translateX(-10%);
                filter: drop-shadow(1px 0 0 var(--yellow)) drop-shadow(-1px 0 0 var(--yellow)) drop-shadow(0 1px 0 var(--yellow)) drop-shadow(0 -1px 0 var(--yellow));
            }
        }

        .item-side > div {
            padding:0.5rem;
        }

        .item-title > * {
            color:white;
            background-color:var(--pink);
            padding:8px;
            margin-bottom:0.5rem;
            padding-left:5rem;
        }
        .item-desc{
            margin-left:5rem;
            margin-right:0.5rem;
        }
        .item-link{
            margin-left:5.5rem;
            color:var(--pink);
        }
    }

    .askal {
        background-color: #edeeff;
        color: black;
    }
    .askal .item-thumb img{
        height: auto;
        width: auto;
        max-height: 100%;
        max-width:150px;
        transform: scale(110%);
        --color:#edeeff;
        --width:2px;
        filter:drop-shadow(var(--width)0 0 var(--color))drop-shadow(calc(-1*var(--width))0 0 var(--color))drop-shadow(0 var(--width)0 var(--color))drop-shadow(0 calc(-1*var(--width)) 0 var(--color))
    }
    .askal .item-desc { color:#6faccc; }
}

#comicContainer{
    column-width: 310px;
    box-sizing: border-box;
    margin: auto;

    .item-container > div{
        display:flex;
        margin: auto;
        margin-bottom: 0.5rem;
        max-width: 700px;

        background-color:var(--color-body);
        color: var(--color-text);
        border: 2px solid var(--color-text);
    }

    .item-thumb{
        flex:1;
        img {
            width: 100%;
            height:100%;
            object-fit: cover;
            display: block;
        }
    }

    .item-side {
        flex:2;
        position:relative;
    }

    .item-side > div {
        padding:1rem;
        position: relative;
        top:50%;transform: translateY(-50%);
    }
    .item-link{margin-top:1rem;}

    a {
        font-weight: bolder;
        font-family: var(--display-font);
        
        &:after {
            opacity: 0;
            transform: translateX(-100%);
            position: absolute;
            display:inline-block;
            margin-left: 0.5rem;
            content: " »";
            transition: 0.1s;
        }
        
        &:hover:after{
            opacity: 1;
            transform: none;
        }
    }
}

.temp {
    padding: 1rem;
    border: 2px solid;
    border-radius: 4px;
    margin-bottom: 0.5rem;
}
{% endcapture %}
{{ css | scssify }}
</style>
