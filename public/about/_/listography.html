<style>
{% capture scss %}
@import url('https://fonts.googleapis.com/css2?family=Barriecito&display=swap');

img { max-width: 100%; display: block; }

#lists > div {
    background-color: var(--color-body);
    border-color: var(--color-accent-dkest)!important;
    border-radius: 4px;
}

#lists > div:target{ outline: 5px solid var(--color-accent); }
#lists > div:target h2{ color: var(--color-accent); }

#lists li { 
    position: relative;

    a:after {
        position: absolute;
        opacity: 0;
        transform: translateX(-100%);
        display:inline-block;
        margin-left: 0.5rem;
        content: " »";
        transition: 0.1s;
    }

    &:after{
        opacity: 1;
        transform: none;
    }
}

button { padding: 0.5rem;}

.randomizer-output {
    display: block;
    margin-bottom: 1rem;
    border-left: 3px solid var(--color-accent);
    padding-left: 1rem;
}

.facts-finished {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
}
.facts-finished span {
    font-family:var(--display-font);
    font-weight:bold;
}
.facts-finished img {
    display: block;
    max-width: 100px;
    width: 100%; height: auto;
}

/* Remember to change this ty */
#jump_to_strings li::marker { color: lightgray; }
#jump_to_buttons {
    margin-bottom: 1rem;
}

#jump_to_fanfiction > p > strong::after { content: " » "}

#jump_to_artist, #jump_to_webmaster {
    min-height: 300px;
    max-height: 50vh;
    overflow: auto;

    dd {
        margin: 0.5rem 0 1rem 1rem;
        padding-left: 1rem;
        border-left: 3px solid var(--color-accent);
    }
    dd a { font-family: var(--display-font);}
    dd ul { margin-left: 0; padding-left: 0; list-style-position: inside;}
}

.justified-gallery {margin-bottom: var(--gap);}

.justified-gallery {margin-bottom: var(--space);}
{% endcapture %}
{{ scss | scssify }}
</style>
