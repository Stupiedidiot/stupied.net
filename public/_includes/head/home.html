<style>
{% capture css %}
main {
    margin: auto;
    padding: 1rem;
    width: 95%;
    max-width: 750px;
    box-sizing: border-box;

    #frame {
        background-color: #e5e5f7;
        background-image:  linear-gradient(#444cf7 1.1px, transparent 1.1px), linear-gradient(to right, #444cf7 1.1px, #e5e5f7 1.1px);
        background-size: 22px 22px;
    }
}

.meow span{display: inline-block;}
.meow span:nth-of-type(n){animation:jump 1s infinite; }
.meow span:nth-of-type(2n){animation:fall 1s infinite;}

@keyframes jump {
    50% {transform:translateY(5%);}
    100% {transform:translateY(-5%);}
}

@keyframes fall {
    50% {transform:translateY(-5%);}
    100% {transform:translateY(5%);}
}

article { display: flex; gap: 1rem; }
#intro {
    margin-top: 1.5rem;
    flex: 3;
}
#temp { flex: 2; }

#intro a:hover {color: var(--color);}

#webrings {
    flex: 300px;
    box-sizing: border-box;
    border: 2px solid black;
    border-radius: 4px;
    width: 100%;
    aspect-ratio: 1/1;
    position: relative;
    background-color: white;
}

#webrings > div {
    overflow: auto;
    height: 100%;
}

#webrings > div > a {
    display: block;
    padding: 1rem;
    padding-top: 0;
}

#grrrl {
    position: absolute;
    bottom: -1.5rem;
    right: 0.5rem;
    width: 6rem;
}

#grrrl img { width: 100%; }

@media only screen and (max-width: 600px) {
    article { display: block; }
    #temp #webrings {
        aspect-ratio: 2/1;
    }
}

/* RSS FEED START */
#feed {
    margin: auto;
    margin-top: 1rem;
    border: 3px solid black;
    a:hover { color: var(--color) }
    ul { padding-left: 0.5rem; }
}

#feed-first {
    flex: 40%;
    position: relative;
    display: block;
    min-height: 150px;
    background-image: var(--thumb);
    background-size: cover;
    background-position: 50%;
    overflow: hidden;

    span > span { display: none; }
    > div { 
        opacity: 0; 
        transition: 0.2s;
        z-index: 2;
        text-align: center;
        position: absolute;
        top: 80%;
        left: 50%;
        transform: translateX(-50%) translateY(-50%);
        > span { color: white; }
    }

    &::after {
        content: "";
        display: block;
        z-index: 1;
        background: black;
        opacity: 0;
        width: 100%;
        height: 100%;
        position: absolute;
        transition: 0.2s;
    }

    &:hover {
        &::after { opacity: 0.9; }
        > div { opacity: 1; top: 50%; }
    }
}

#feed-timeline {
    flex: 60%;
    padding: 1.5rem;
    > h2 { color:var(--yellow) }
    > ul { margin-bottom: 0.5rem; }
    cursor: pointer;
}

.feed-item {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    
    h4 { display: inline-block; }
    h4::after { content: " » "}
    a { color: var(--gray); }
}

.feed-more {
    color: var(--);
    font-size: bolder;
    font-family: var(--display-font);
}

.feed-title > span {display: none;}

@media only screen and (min-width: 600px) {
    #feed-content { display: flex; }
}
/* RSS FEED END */
{% endcapture %}
{{ css | scssify }}
</style>
<script type="" src="/meta/js/tooltip.js" defer></script>
