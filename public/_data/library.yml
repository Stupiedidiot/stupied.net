- id: psych
  title: Psych!
  description: Being a psychic sucks actually.
  external: https://psych.stupied.net/
  yap: |-
    This is comic I initially thought up back in 2019-ish. It's a absurdist 'monster of the week' episodic comic series - it will make more sense once I actually get to making it lol. Right now, the comics featured here are just short one off jokes I made. Truthfully, I plan to create this comic along the way; Not having a exact number of issues planned nor a plot point to work towards. Think of the future comics here as like character studies hidden under multiple layers of irony.

