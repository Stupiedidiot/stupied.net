---
layout: log
title: Habit Tracker
js:
- /logs/main.js
---

<article class="padded" data-nosnippet>
  <h1>{{ page.title }}</h1>
  {% include_cached noscript.liquid %}

  <div class="calendar">
    <ol id="log_labels" class="calendar-labels font-display">
        <li>Sun</li>
        <li>Mon</li>
        <li>Tue</li>
        <li>Wed</li>
        <li>Thu</li>
        <li>Fri</li>
        <li>Sat</li>
    </ol>
    <ol id="log_target" class="calendar-content">
    </ol>
  </div>
</article>

<div class="modal close" data-nosnippet>
  <div class="modal-content">

    <div class="modal-head padded border-dashed-bottom">
      <div id="view_target_head" class="h3"></div>
      <button role="button" title="Close Popup" onclick="toggleModal()">
        <span class="icon-close-outline"></span>
      </button>
    </div>
    
    <div id="view_target" class="padded content" style="min-height: auto;"></div>

    <ul class="sub border-top border-accent">
      <li>
          <button id="nextprev_prev_sub" title="View Previous Day">
              <span class="icon-arrow-thin-left"></span>
              <span>Prev</span>
          </button>
      </li>

      <li>
          <button id="nextprev_next_sub" title="View Next Day">
              <span>Next</span>
              <span class="icon-arrow-thin-right"></span>
          </button>
      </li>
    </ul>
  </div>
</div>


<ul class="sub border-top border-accent">
  <li>
      <a id="nextprev_prev" href="#" title="View Previous Month">
          <span class="icon-arrow-thin-left"></span>
          <span>Prev</span>
      </a>
  </li>

  <li>
      <a id="nextprev_curr" href="#" title="View Current Month">
          <span class="icon-calendar"></span>
          <span>Current</span>
      </a>
  </li>


  <li>
      <a id="nextprev_next" href="#" title="View Next Month">
          <span>Next</span>
          <span class="icon-arrow-thin-right"></span>
      </a>
  </li>
</ul>
