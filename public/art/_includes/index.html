<header class="home" data-nosnippet>
    <div id="headerDoll"></div>
    <div id="headerStamps">
        {%- assign recent = site.art | reverse | where_exp: "item", "item.date <= site.time" | first -%}
        {% assign recent_path = recent.path | getArtPath %}
        <div style="bottom: 52%; left: 3%;">
            <a href="./p/{{ recent_path }}" id="recent" class="stamp" style="--bg: url(./img/{{ recent_path | append: '.' | append: recent.ext}});">
                <span>Most Recent</span>
            </a>
        </div>

        <div style="top:52%; left:45%;">
            <a href="https://ko-fi.com/stupied/commissions" class="stamp" style="--bg: url(/art/img/24/Dear-Diary.jpg);">
                <span>Commission</span>
            </a>
        </div>

        <div style="top:52%; left: 8%; width: 35%;">
            <a href="/about/art#from-art" class="stamp" style="--bg: url(/art/img/24/Looming.jpg);">
                <span>Art Usage</span>
            </a>
        </div>

        <div style="bottom: 52%; left: 55%; width: 30%;">
            <a href="https://album.stupied.net/fanart/" class="stamp" style="--bg: url(https://album.stupied.net/fanart/img/21/Greg.jpg);">
                <span style="color: black;">Fanart</span>
            </a>
        </div>
    </div>
</header>
