<style>
{% capture css %}
header.home {
    display: flex;
    gap: 0.2rem;
    background-color: black;
    aspect-ratio: 2/1;
    max-width: 100vw;
    border-bottom: 3px solid black;
}

#header {
    &Doll {
        flex: 2;
        background: url(/art/img/25/drawin/10.jpg);
        background-size: 100% 100%;
        background-color: var(--color-accent);
    }

    &Stamps {
        flex: 3;
        position: relative;

        > div {
            position: absolute;
            width: 50%;
        }
    }
}

#about {
  margin-bottom: 1rem;
  display: flex;
  border-radius: 4px;
}

#links {
  flex: 1;
  border: 1px solid var(--color-accent);
  background-color: var(--color-accent-lter);
}

#list{
  flex: 2;
  margin-bottom: 1rem;
}

#list ul,
#sketchbooks ul {
  display: flex;
  flex-wrap: wrap;
  list-style-position: inside;
  gap: 1rem;
  margin-left: 0;
  padding-left: 0;

  a:hover { color: var(--color); }
}

#recent{ background-position: 50% 50%; }

#sketchbooks > div {
    --space: 1rem;
    --min-height: 110px;
    user-select: none;
    display: flex;
    flex-wrap: wrap;
    grid-gap: var(--space);
    list-style: none;
    margin-bottom:0.5rem;
    padding:1rem;

    &:not(:last-of-type){
        padding-bottom:0;
    }

    & > *{
        width:100%;
        flex-grow: calc(var(--width) * (100000 / var(--height)));
        flex-basis: calc(var(--min-height) * (var(--width) / var(--height)));
        aspect-ratio: var(--width) / var(--height);
        position: relative;
        overflow: hidden;
        margin: 0 !important;
        padding: 0 !important;
    }

    & > * > img {
        position: absolute;
        width: 100%;
        height: 100%;
    }

    & a{
        box-shadow:0 0 5px rgba(0, 0, 0, 0.8);
        transition: 0.2s;

        &:nth-child(odd):hover{transform: scale(110%) rotate(-3deg);z-index:1;}
        &:nth-child(even):hover{transform: scale(110%) rotate(3deg);z-index:1;}

        &:hover img{
           transform: none;
        }
    }
}

#commission {
  display: block;
  margin-top: 1rem;
  font-family: var(--display-font);
  font-weight: bold;
  &:hover{color:var(--color);}
}
{% endcapture %}
{{ css | scssify }}
</style>
