url: "https://stupied.net"
title: "stupied stuff!"
description: "Website for Stupied's stupid stuff"
keywords: [stupied,art,comics,blog,ocs]

nav:
  - title: Home 
    icon: home
    link: /
  
  - title: About
    icon: mood-happy-outline
    link: /about/
  
  - title: Art
    icon: camera
    link: /art/
  
  - title: Blog
    icon: compose
    link: /blog/
  
  - title: Library
    icon: book-reference
    link: /lib/

  - title: Chez
    icon: music-notes
    link: /chez/

  - title: Code
    icon: printer
    link: /code/

  - title: Outer
    icon: globe
    link: /outlinks/

# Build settings
source: public
destination: _site
keep_files:
- pagefind

sass:
  style: compressed
  sourcemap: never
  quiet_deps: true

jekyll-minifier:
  compress_css: false
  compress_javascript: false
  exclude:
  - feed.xml
  - "*.txt"
  
defaults:
  - scope:
      path: about/
    values:
      layout: about

  - scope:
      path: art/
    values:
      layout: art

  - scope:
      type: art
    values:
      layout: art-view

  - scope:
      type: reviews
    values:
      layout: reviews

  - scope:
      type: posts
    values:
      layout: post

  - scope:
      path: comic/*/
    values:
      layout: comic

# Paginate  
pagination:
  enabled: true

# Pagefind Settings
pagefind:
  exclude:
   - ".art-archive-tags > button"
   - "header"
   - "nav"
   - "footer"

# Collection Stuff
collections_dir: snail

collections:
  art:
    output: true
    permalink: /art/p/:path
    sort_by: date
  img:
    output: true
    permalink: /:path
  
  micro:
  posts:
    permalink: /blog/:name_raw